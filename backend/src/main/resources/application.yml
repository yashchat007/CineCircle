server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: cinecircle
  config:
    # Local secrets file (git-ignored). Real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cinecircle}
    username: ${DATABASE_USERNAME:cinecircle}
    password: ${DATABASE_PASSWORD:cinecircle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cinecircle:
  jwt:
    # Base64 or plain secret of at least 32 bytes. Must be overridden outside local development.
    secret: ${JWT_SECRET:local-development-secret-change-me-please-32b}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tmdb:
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    api-token: ${TMDB_API_TOKEN:}
