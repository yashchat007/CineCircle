services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinecircle
      POSTGRES_USER: cinecircle
      POSTGRES_PASSWORD: cinecircle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinecircle -d cinecircle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/cinecircle
      DATABASE_USERNAME: cinecircle
      DATABASE_PASSWORD: cinecircle
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters)}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:?Set TMDB_API_TOKEN}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
